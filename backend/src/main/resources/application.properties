spring.application.name=youtube-research-agent

server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/youtube_research}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

youtube.api.key=${YOUTUBE_API_KEY:}

jwt.secret=${JWT_SECRET:mysecretkeythatisatleast32characterslong}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.issuer=${JWT_ISSUER:youtube-research-agent}
jwt.audience=${JWT_AUDIENCE:web-client}

ollama.base-url=${OLLAMA_BASE_URL:http://localhost:1234}
ollama.model=${OLLAMA_MODEL:mistralai/mistral-7b-instruct-v0.3}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true